[package]
name = "fcitx5-niri-panel"
version = "0.1.0"
edition = "2021"
description = "Standalone Fcitx 5 Kimpanel-compatible candidate panel for Niri"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[dev-dependencies]
pretty_assertions = "1"

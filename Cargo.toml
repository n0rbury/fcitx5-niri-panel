[package]
name = "fcitx5-niri-panel"
version = "0.1.0"
edition = "2021"
description = "Standalone Fcitx 5 candidate/preedit panel for Niri"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
pretty_assertions = "1"
